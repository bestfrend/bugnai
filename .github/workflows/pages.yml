name: Publish versioned drum kit

on:
  push:
    branches: [master]

permissions:
  contents: read

# Finish each release before starting the next so older pushes cannot overwrite it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check database permissions and recording limits
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Prepare versioned site
        run: |
          mkdir -p _site
          python3 scripts/build-studio.py
          cp index.html studio.html admin.html index.js kits.js app.js admin.js database.js supabase-config.js styles.css _site/
          cp -R images sounds _site/
          python3 - <<'PY'
          import os
          from pathlib import Path

          # The workflow run number increases for each push, even with several commits.
          # Re-running an existing workflow preserves that release's version.
          version = f"1.{int(os.environ['GITHUB_RUN_NUMBER']):02d}"
          marker = '<span id="app-version">1.01</span>'
          for name in ['index.html', 'studio.html']:
              page = Path('_site') / name
              html = page.read_text()
              if html.count(marker) != 1:
                  raise SystemExit('Expected exactly one version marker')
              page.write_text(html.replace(marker, f'<span id="app-version">{version}</span>'))
          print(f'Publishing version {version}')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
